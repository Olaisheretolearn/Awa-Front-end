# This machine has roughly 5 GB RAM. A 4 GB Gradle heap leaves too little
# address space for Android tooling and caused the recorded JVM startup crash.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=false
